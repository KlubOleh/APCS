name: CI

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

permissions:
  contents: read

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Build and test on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: ci.bat
      - name: Build and test on Linux and macOS
        if: runner.os != 'Windows'
        shell: bash
        run: ./ci.sh
      - uses: actions/upload-artifact@v4
        with:
          name: hello-${{ runner.os }}
          path: dist/hello.jar
